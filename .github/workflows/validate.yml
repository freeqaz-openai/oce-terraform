name: Validate Terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [aws-eks, azure-aks, gcp-gke]
    defaults:
      run:
        working-directory: targets/${{ matrix.target }}
    env:
      TF_IN_AUTOMATION: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - name: Install kubectl for the credential policy test
        if: matrix.target == 'aws-eks'
        run: |
          curl --proto '=https' --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/kubectl" \
            https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          printf '%s  %s\n' a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989 "$RUNNER_TEMP/kubectl" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/kubectl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test cluster handoff and system policies
        if: matrix.target == 'aws-eks'
        run: python3 -B -m unittest discover -s tests -v
